backend:
  name: github
  repo: PremaMokshaAstrology/Prema-Moksha-Astrology
  branch: main

media_folder: "images/uploads"
public_folder: "images/uploads"

collections:
  - name: "posts"
    label: "Blog Posts"
    folder: "posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Category", name: "category", widget: "select", options: ["Forecast", "Guide", "Transit", "Beginner", "Retrograde", "Lifestyle"] }
      - { label: "Featured Image", name: "thumbnail", widget: "image", required: false }
      - { label: "Body", name: "body", widget: "markdown" }
